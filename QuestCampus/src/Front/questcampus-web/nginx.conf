# Le navigateur ne connaît qu'une seule origine (http://localhost:8080) :
# pas de CORS, et les cookies HttpOnly SameSite=Strict du BFF fonctionnent naturellement.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API (BFF : authentification, agrégation, YARP)
    location ~ ^/(bff|api)/ {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (WebSocket)
    location /hubs/ {
        proxy_pass http://bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Application monopage : toute autre route renvoie index.html
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
